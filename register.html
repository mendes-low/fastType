<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/theme.css" />
    <link rel="stylesheet" href="./css/leaderboard.css" />
    <link rel="stylesheet" href="./css/register.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <header id="header"></header>
      <main id="main">
        <div class="register-container">
          <section class="regestration-bar">
            <h1 class="title">register</h1>
            <form id="registration-form">
              <input
                class="register-inputs"
                id="username"
                type="text"
                placeholder="username"
              />
              <input
                class="register-inputs"
                id="email"
                type="email"
                placeholder="email"
              />
              <input
                class="register-inputs"
                id="password"
                type="password"
                placeholder="password"
              />

              <input
                class="register-inputs"
                id="verify-password"
                type="password"
                placeholder="verify password"
              />

              <button class="register-inputs" type="submit">sign up</button>
              <p id="error"></p>
            </form>
          </section>

          <section class="login-bar">
            <h1 class="title">log in</h1>
            <form id="login-form">
              <input
                class="register-inputs"
                id="login-email"
                placeholder="email"
                type="email"
              />
              <input
                class="register-inputs"
                id="login-password"
                placeholder="password"
                type="password"
              />
              <div class="remember-box">
                <input
                  class="register-inputs"
                  type="checkbox"
                  id="checkbox_remember"
                />
                <label for="checkbox_remember">remember me</label>
              </div>
              <button class="register-inputs" type="submit">sign in</button>
              <div class="link">I forgot my password <a href="#">reset</a></div>
              <p id="err"></p>
            </form>
          </section>
        </div>
      </main>

      <div class="background">
        <span class="floating-letter" style="--d: 0s; --s: 1.5; left: 10%"
          >A</span
        >
        <span class="floating-letter" style="--d: 2s; --s: 0.8; left: 30%"
          >B</span
        >
        <span class="floating-letter" style="--d: 1s; --s: 1.2; left: 50%"
          >C</span
        >
        <span class="floating-letter" style="--d: 3s; --s: 2; left: 70%"
          >D</span
        >
      </div>
    </div>
    <script src="./js/auth.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/layout.js"></script>
  </body>
</html>
